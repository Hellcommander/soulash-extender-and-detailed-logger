; Variants: one version of a mod's skills for the plain game, a deeper one for the
; game with the extender (docs/variants.md).
;
; A mod keeps its plain-game files where they always are and puts the extender
; version of any of them in the same relative place below
; <mod>\extender\variants\ (abilities\Fireball.json, passives.json, skills.json,
; milestones\..., plus files that exist only there). The plain game never looks
; there.
;
; Mode=log (default): nothing changes; the game loads the plain-game files and
; each extender version the game WOULD have loaded is logged once ("would use").
; Use this for the first run on a new game build.
; Mode=active: the game loads the extender versions. While a mod has extender
; versions loaded, anything the game writes into that mod (the mod editor saves
; abilities from what is loaded) goes to <mod>\extender\editor_saves\ instead,
; so the plain-game files are never overwritten. To edit the plain-game files in
; the mod editor, switch to Mode=log (or Enabled=0) and restart.
; Lines starting with "Variants:" in logs\proxy-crash.log show what it did.
[Variants]
Enabled=1
Mode=log
; LogFiles=1 writes one line the first time each extender version is used.
LogFiles=1
MaxLogLines=300
