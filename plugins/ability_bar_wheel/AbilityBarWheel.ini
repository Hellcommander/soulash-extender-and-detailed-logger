; AbilityBarWheel: switch ability-bar sets with the mouse wheel.
; OFF by default. Set Enabled=1 to turn it on. Only game build 924e1ef3 (0.10.4.0.1)
; is supported; on any other build the plugin logs "inactive" and does nothing.
; Lines starting with "AbilityBarWheel:" in logs\proxy-crash.log show what it did.
; With [Plugins] RequireHash=1 the DLL must be listed in [PluginHashes]; the build
; prints the line to paste after every rebuild.
[AbilityBarWheel]
Enabled=0
; Trigger=modifier: the wheel switches while the Modifier key is held, anywhere.
; Trigger=overbar:  the wheel switches while the cursor is over the ability bar.
Trigger=modifier
; Modifier=ctrl|shift|alt.
Modifier=ctrl
; SuppressModifierKey=1 hides the modifier's own key presses from the game while
; in the game world. Default 1 for ctrl (Left Ctrl is the game's own Ability Bar
; Switch key and auto-repeats while held, flipping the bar every few frames),
; 0 for shift and alt. With it on, Ctrl alone no longer toggles the bar.
SuppressModifierKey=1
; HoldMs: the modifier must be held this long before the wheel switches sets;
; until then the wheel keeps zooming the camera as usual.
HoldMs=400
; LogEvents=1 writes one log line per wheel event and per arm/disarm (diagnostic,
; at most 300 event lines per game session); set 0 once everything works.
LogEvents=1
; SwallowWheel=1: only the wheel notches that switch a set (modifier held long
; enough, or cursor over the bar with Trigger=overbar) are hidden from the game, so
; those notches do not also zoom the camera. All other scrolling zooms as usual.
; 0: the switching notches are passed to the game too (switch and zoom together).
SwallowWheel=1
