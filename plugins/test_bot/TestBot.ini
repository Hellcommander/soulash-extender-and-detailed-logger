; TestBot: built-in test bot. OFF by default.
; While Enabled=1, Steam achievements AND stats are blocked for the whole game
; session (SetAchievement, achievement progress, SetStat, StoreStats, ... report
; success to the game but nothing reaches Steam), whether or not the script runs.
; If blocking cannot be installed the bot refuses to run.
; Lines starting with "TestBot:" in logs\proxy-crash.log show what it did.
; Turn it OFF again (Enabled=0) and restart the game to earn achievements normally.
[TestBot]
Enabled=0
; Step script in this folder (plain file name only). Format: docs/test-bot.md.
Script=TestBot.script
; StopOnFailure=1 stops the script at the first failed check; 0 runs to the end.
StopOnFailure=0
; LogBlockedCalls=1 writes one line per blocked Steam call (at most 200 per session).
LogBlockedCalls=1
