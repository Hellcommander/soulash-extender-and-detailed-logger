; Triggers: conditional triggers for abilities, run by the extender itself
; (docs/triggers.md). Rules come from each mod's extender\conditions.json
; (`triggers`) and extender\effects.json (`triggers`); nothing has to be compiled
; into passives any more, and the in-game mod editor never touches these files.
;
; Mode=log (default): the hooks are installed and every cast / attack event is
; logged together with the rules that matched and what WOULD have been queued,
; but nothing is queued. Use this for the first run on a new game build.
; Mode=active: matching rules queue their ability on the holder exactly like the
; engine's own trigger_ability_on_cast / on_attack_cast passives do.
; Lines starting with "Triggers:" in logs\proxy-crash.log show what it did.
[Triggers]
Enabled=1
Mode=log
; LogEvents=1 writes one line per cast / attack event the hooks see (capped at
; MaxLogLines per game session); 0 logs only rule firings and problems.
LogEvents=1
MaxLogLines=400
; At most this many abilities are queued per event (all rules together).
MaxCastsPerEvent=8
