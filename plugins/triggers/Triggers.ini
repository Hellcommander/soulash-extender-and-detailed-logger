; Triggers: conditional triggers for abilities, run by the extender itself
; (docs/triggers.md). Rules come from each mod's extender\conditions.json
; (`triggers`) and extender\effects.json (`triggers`); nothing has to be compiled
; into passives any more, and the in-game mod editor never touches these files.
;
; Mode=log (default): the hooks are installed and every cast / attack event is
; logged together with the rules that matched and what WOULD have been queued,
; but nothing is queued. Use this for the first run on a new game build.
; Mode=active: matching rules queue their ability on the holder exactly like the
; engine's own trigger_ability_on_cast / on_attack_cast passives do.
; Lines starting with "Triggers:" in logs\proxy-crash.log show what it did.
[Triggers]
Enabled=1
Mode=log
; LogEvents=1 writes one line per cast / attack / kill / damaged / dodge / block /
; crit event the hooks see (capped at MaxLogLines per game session); 0 logs
; only rule firings and problems.
LogEvents=1
; Turn events happen once per turn for EVERY creature with effects (hundreds per
; turn). 0: never logged. 1: logged for the creatures a turn rule was allowed
; for (a rule with holder_tag: Player logs exactly the player's turns). 2: every
; creature a turn rule matched, allowed or not.
LogTurnEvents=0
MaxLogLines=400
; At most this many abilities are queued per event (all rules together).
MaxCastsPerEvent=8
; LogExceptions=1 logs every first-chance C++ exception in the process (type,
; what(), a short stack, whether a Triggers hook was on the stack), at most
; MaxExceptionLines per session. An unhandled one is what the game's own
; crash path turns into a null write at RVA 0x6F3A12; this line names it.
LogExceptions=1
MaxExceptionLines=40
;
; Rule files come from <game>\data\mods\<mod>\extender\ unless the extender's
; SoulashExtender.ini sets [Conditions] Directory or SOULASH2_MODS_DIRECTORY is
; set (the same folder the extender core reads).
